name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install runtimes
        run: |
          for r in react vue svelte solid webcomponent; do (cd packages/ui/$r && bun install --frozen-lockfile); done
          for r in twig latte; do (cd packages/ui/$r && composer install --no-interaction --no-progress); done
          pip install -e packages/ui/jinja2
          go run github.com/a-h/templ/cmd/templ@v0.3.1070 generate -path packages/ui/templ
      - name: ui8px lint
        run: npx --yes ui8px@0.2.5 lint --ignore 'packages/ui/*/tests/out'
      - name: html/aria gates (9 runtimes)
        run: bash tools/gates.sh
      - name: shared layer generated from packages/shared (skin, types, icons, theme; 9 runtimes)
        run: bun tools/gen-shared.ts --check
      - name: brand registry manifests generated (packages/registry/src, 9 runtimes)
        run: bun tools/gen-registry.ts --check
      - name: parity with react (8 runtimes, DOM + classes + ARIA)
        run: python3 tools/parity.py .cache/gates
      - name: typecheck + package tests (5 JS runtimes)
        run: for r in react vue svelte solid webcomponent; do (cd packages/ui/$r && echo "== $r" && bun run typecheck && bun run test); done
      - name: ui8kit check (CLI-owned files unchanged, 9 runtimes)
        run: for r in react vue svelte solid webcomponent templ twig latte jinja2; do (cd packages/ui/$r && echo "== $r" && npx --yes ui8kit@3 check); done
      - name: brand registry smoke (build, local server, init + add into clean dirs, check, render, parity 20/20)
        run: bash tools/registry.sh smoke
      - name: templ, Twig, Latte, Jinja2 tests
        run: |
          (cd packages/ui/templ && go vet ./... && go test ./...)
          for r in twig latte; do (cd packages/ui/$r && php tests/widgets_test.php); done
          (cd packages/ui/jinja2 && python3 -m unittest discover -s tests)
  mirror-drift:
    # Informational (not a required check): the mirrors' trees must equal packages/ui/<name> on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rc=0
          for n in twig latte; do
            git fetch -q --depth=1 https://github.com/authfly/$n.git main
            a=$(git rev-parse HEAD:packages/ui/$n); b=$(git rev-parse 'FETCH_HEAD^{tree}')
            if [ "$a" = "$b" ]; then echo "$n: in sync ($a)"; else echo "::warning::$n mirror differs: source $a, mirror $b"; rc=1; fi
          done
          exit $rc
