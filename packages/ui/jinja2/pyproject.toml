[project]
name = "authfly-jinja2"
version = "0.0.0"
description = "Authfly widgets for Jinja2 on UI8Kit 3 primitives (CLI 3.2.1, registry 3.2.0)"
requires-python = ">=3.10"
dependencies = ["Jinja2>=3.1,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["authfly_jinja", "ui8kit_jinja"]
